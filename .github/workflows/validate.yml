name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions: {}

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.13"
            homeassistant: "2025.1.0"
          - python-version: "3.14"
            homeassistant: "2026.9.4"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.homeassistant }}" = "2025.1.0" ]; then
            python -m pip install -r requirements-test-minimum.txt
          else
            python -m pip install -e .[test] "homeassistant==2026.9.4" "pytest-homeassistant-custom-component==0.13.367"
          fi

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest

      - name: Strict typing against current stable HA
        if: matrix.homeassistant != '2025.1.0'
        run: python -m mypy --strict custom_components/devialet
